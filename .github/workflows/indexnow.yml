name: IndexNow bildirimi

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canlı yayının güncellenmesini bekle
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent "https://zeynepbatuhan.com/5c8fbec8f9ac2266084afa490aea3729.txt" | grep --quiet '^5c8fbec8f9ac2266084afa490aea3729$'; then
              exit 0
            fi
            sleep 10
          done
          echo "IndexNow anahtar dosyası canlı sitede bulunamadı."
          exit 1

      - name: Sitemap URL'lerini IndexNow'a gönder
        run: |
          python3 - <<'PY' > /tmp/indexnow.json
          import json
          import xml.etree.ElementTree as ET

          namespace = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in ET.parse("sitemap.xml").findall(".//s:loc", namespace)]
          print(json.dumps({
              "host": "zeynepbatuhan.com",
              "key": "5c8fbec8f9ac2266084afa490aea3729",
              "keyLocation": "https://zeynepbatuhan.com/5c8fbec8f9ac2266084afa490aea3729.txt",
              "urlList": urls,
          }))
          PY
          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
